name: Site audit (outside-in)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: App origin to audit
        required: true
        default: https://web-production-4b215.up.railway.app
      apex_url:
        description: Public entry URL expected to land on the app
        required: true
        default: https://russellcapitalsystems.com/
      max_pages:
        required: true
        default: "90"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/audit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run audit
        env:
          BASE_URL: ${{ inputs.base_url }}
          APEX_URL: ${{ inputs.apex_url }}
          MAX_PAGES: ${{ inputs.max_pages }}
          OUT_DIR: ${{ github.workspace }}/audit-out
        run: cp .github/audit/site-audit.mjs /tmp/pw/ && cd /tmp/pw && node site-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-audit
          path: audit-out
          retention-days: 7
