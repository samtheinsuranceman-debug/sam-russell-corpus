name: Railway custom domain query

on:
  workflow_dispatch:
    inputs:
      railway_token:
        description: Railway account token (masked in logs)
        required: true
      domain_id:
        required: true
        default: 7f74d3e7-8625-442b-84b6-06604f76d077
      project_id:
        required: true
        default: a16ef4bb-3aea-4147-a751-20661ae76eb8

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token
        run: echo "::add-mask::${{ inputs.railway_token }}"
      - name: Query
        env:
          RT: ${{ inputs.railway_token }}
          DID: ${{ inputs.domain_id }}
          PID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          Q='query($id:String!,$p:String!){ customDomain(id:$id,projectId:$p){ id domain status { verificationToken certificateStatus dnsRecords { hostlabel fqdn recordType requiredValue currentValue status } } } }'
          jq -cn --arg q "$Q" --arg id "$DID" --arg p "$PID" '{query:$q,variables:{id:$id,p:$p}}' > /tmp/req.json
          curl -sS -m 60 -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RT" -H "Content-Type: application/json" \
            --data-binary @/tmp/req.json | jq .
