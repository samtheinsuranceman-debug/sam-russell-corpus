# Consolidation CI — gates every PR that touches the application.
#
# Path-scoped deliberately. sam-russell-corpus holds ~45 top-level projects and
# 6,008 files; an unscoped workflow would run this suite when somebody commits
# a PDF to /brotherhood.
#
# Runs the FULL test suite, not `test:ci`. The `test:ci` script carries an
# exclude list of 28 files that all currently pass (verified 2026-09-20,
# 4,138 passing / 0 failing) — so the exclusions suppress working tests and
# would go on suppressing them if they broke. Until that script is fixed, CI
# runs `pnpm test`.
name: Consolidation CI

on:
  pull_request:
    paths:
      - "russell-capital-systems/**"
      - ".github/workflows/consolidation-ci.yml"
  push:
    branches: [master]
    paths:
      - "russell-capital-systems/**"

defaults:
  run:
    working-directory: russell-capital-systems

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: russell-capital-systems/pnpm-lock.yaml

      # --frozen-lockfile, so a PR cannot quietly drift a dependency.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      # Every route registered must be in the manifest and vice versa. Both
      # directions: an unlisted route is an undeclared surface, a listed but
      # unregistered one is a dead link somebody already points at.
      - name: Route manifest reconciliation
        run: node scripts/consolidation/route-collisions.mjs --check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      # The third leg. The step above emits dist/public/routes.json with its own
      # route list, and that list can diverge from App.tsx and the manifest
      # without either noticing — a build-time filter or a code-splitting
      # boundary can drop a route the other two still agree on. That failure is
      # a production 404 with green CI. Baseline: all three read 330.
      # See docs/consolidation/ADDENDUM-03-nlp-and-numbering.md §3.
      - name: Built-route agreement
        run: |
          set -euo pipefail
          app=$(grep -o 'path="[^"]*"' client/src/App.tsx | sort -u | wc -l)
          manifest=$(sed -n '/ROUTE_MANIFEST/,/^]/p' shared/routeManifest.ts | grep -c '^\s*"')
          built=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/public/routes.json','utf8')).routes.length)")
          echo "App.tsx=$app  routeManifest.ts=$manifest  dist/public/routes.json=$built"
          if [ "$app" != "$manifest" ] || [ "$app" != "$built" ]; then
            echo "::error::Route counts disagree. App.tsx=$app manifest=$manifest built=$built"
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Application source only. PROVENANCE.md records that nine Slack
      # placeholder patterns were previously neutered for exactly this reason;
      # this keeps that property true rather than trusting it to stay true.
      # Self-evident placeholders are reported but do not fail the run.
      #
      # Without this the gate is red on arrival: it matches
      # `client/src/pages/portal/Integrations.tsx:261`, the literal
      # `value="xoxb-EXAMPLE-PLACEHOLDER"` — a UI hint that FOUNDATION.md §5.2
      # already certified as "not a credential". A gate that fails on the one
      # string its own documentation clears teaches reviewers to skip it, which
      # is worse than not having the gate at all.
      #
      # Placeholders are still printed, so a real secret can never be hidden by
      # silently dropping matches. The tradeoff: a credential that literally
      # contains EXAMPLE/PLACEHOLDER/SAMPLE/DUMMY/REDACTED/YOUR_ is ignored —
      # e.g. AWS's own documentation key `AKIAIOSFODNN7EXAMPLE`. That is the
      # intended behaviour; no issued, working credential carries those words.
      - name: Scan application source for credentials
        working-directory: russell-capital-systems
        run: |
          set -uo pipefail
          PATTERN='(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|xox[baprs]-[A-Za-z0-9-]{10,})'
          PLACEHOLDER='EXAMPLE|PLACEHOLDER|REDACTED|SAMPLE|DUMMY|YOUR[-_]|X{6,}'

          hits="$(grep -rInE "$PATTERN" server shared client/src 2>/dev/null || true)"
          if [ -z "$hits" ]; then
            echo "No credential patterns found in application source."
            exit 0
          fi

          ignored="$(printf '%s\n' "$hits" | grep -Ei  "$PLACEHOLDER" || true)"
          real="$(   printf '%s\n' "$hits" | grep -Eiv "$PLACEHOLDER" || true)"

          if [ -n "$ignored" ]; then
            echo "Ignored self-evident placeholders (not credentials):"
            printf '%s\n' "$ignored"
          fi

          if [ -n "$real" ]; then
            printf '%s\n' "$real"
            echo "::error::Possible credential committed to application source. Rotate it, then remove it."
            exit 1
          fi

          echo "No credential patterns found in application source (placeholders ignored)."

      # Alongside the regex scan above, not instead of it — ADDENDUM-01 §7
      # proposed this and left the decision open; ADDENDUM-03 §4 is the
      # comparison the directive requires. The hand-written pattern above stays
      # because it has already caught a real secret in this codebase; gitleaks
      # adds maintained rule packs for provider formats a fixed regex misses.
      # fetch-depth: 0 is set on the checkout above, so a secret added and then
      # removed later in the same branch is still caught.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
