name: drbuddy-probe
on:
  workflow_dispatch:
    inputs:
      base:
        description: Base URL of the Doctor Buddy deployment
        default: https://doctor-buddy-production.up.railway.app
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live Doctor Buddy deployment
        env:
          BASE: ${{ github.event.inputs.base }}
        run: |
          set -u
          fail=0
          probe() { # method path expected-status [data]
            local m=$1 p=$2 want=$3 data=${4:-}
            if [ -n "$data" ]; then code=$(curl -s -o /tmp/body -w '%{http_code}' -X "$m" -H 'content-type: application/json' -H "origin: $BASE" --data "$data" "$BASE$p");
            else code=$(curl -s -o /tmp/body -w '%{http_code}' -X "$m" "$BASE$p"); fi
            if [ "$code" = "$want" ]; then echo "ok   $m $p -> $code"; else echo "FAIL $m $p -> $code (wanted $want)"; head -c 300 /tmp/body; echo; fail=1; fi
          }
          probe GET /healthz 200; cat /tmp/body; echo
          probe GET / 200
          probe GET /finance 200
          probe GET /finance/fact-finder 200
          probe GET /financial-disclaimer 200
          probe GET /login 200
          probe GET /robots.txt 200; grep -q "Disallow: /finance" /tmp/body && echo "ok   robots excludes /finance" || { echo "FAIL robots"; fail=1; }
          probe GET /.well-known/security.txt 200
          probe GET "/api/trpc/finance.readiness?input=%7B%22json%22%3A%7B%7D%7D" 403
          probe GET "/api/trpc/auth.me?input=%7B%22json%22%3Anull%2C%22meta%22%3A%7B%22values%22%3A%5B%22undefined%22%5D%7D%7D" 200
          probe GET "/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A1%7D%7D" 200
          probe GET /api/nothing-here 404
          probe POST /api/auth/email/request 400 '{"email":"not-an-email"}'
          probe POST /api/billing/webhook 404 '{}'
          probe PURGE /api/trpc/auth.me 405
          curl -s -D /tmp/h -o /dev/null "$BASE/"; grep -i "strict-transport-security" /tmp/h >/dev/null && echo "ok   HSTS" || { echo "FAIL HSTS"; fail=1; }
          curl -s "$BASE/" | grep -q "Preview build" && echo "ok   preview banner present" || echo "note: preview banner text not found in shell (rendered client-side)"
          curl -s "$BASE/build-info.json"; echo
          exit $fail
