# Publishes docs/ (the built Russell Capital Systems homepage) to GitHub Pages
# on every push to master. Pages must already be enabled in repository settings;
# GitHub Actions cannot switch it on with the default GITHUB_TOKEN.
name: Publish homepage to GitHub Pages

on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
