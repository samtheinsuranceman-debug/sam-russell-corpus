# Keeps `deploy/rcs` equal to the russell-capital-systems/ subtree of master.
# Railway deploys that slim branch (root "/") instead of snapshotting the whole
# corpus (~800 MB of PDFs and audio) on every build.
name: Publish deploy/rcs

on:
  push:
    branches: [master]
    paths: ["russell-capital-systems/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-rcs
  cancel-in-progress: true

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Split subtree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=russell-capital-systems -b deploy/rcs
      - name: Push
        run: git push --force origin deploy/rcs
      # Railway's GitHub app has not been delivering push events for this repo,
      # so ask Railway to deploy directly. Needs a RAILWAY_TOKEN repository secret
      # (Railway → Account → Tokens); the step is a no-op until it exists.
      - name: Trigger Railway deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: e8d1eb7b-21e6-41ca-a567-aa2dc0e20f28
          ENVIRONMENT_ID: fe806289-faed-4850-b030-b47f8dc4c70f
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "RAILWAY_TOKEN not set; skipping"; exit 0; fi
          curl -fsS https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceDeployV2(serviceId: \\\"$SERVICE_ID\\\", environmentId: \\\"$ENVIRONMENT_ID\\\") }\"}"
