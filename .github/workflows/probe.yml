name: Probe URLs

on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated URLs to probe
        required: true
        default: https://russellcapitalsystems.com/ https://www.russellcapitalsystems.com/

permissions:
  contents: read
  pages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Pages config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | head -c 1500 || true
          echo
      - name: Probe
        run: |
          for u in ${{ inputs.urls }}; do
            echo "=================== $u"
            echo "--- dns"; getent hosts "$(echo "$u" | sed -E 's#https?://([^/]+).*#\1#')" || true
            echo "--- headers"; curl -sS -m 25 -o /tmp/body -D - "$u" -A "rcs-probe" || echo "curl exit $?"
            echo "--- body head"; head -c 1200 /tmp/body 2>/dev/null; echo
          done
